spring:
  application:
    name: jobs-service
  datasource:
    url: ${JOBS_DB_URL:jdbc:postgresql://localhost:5432/jobs}
    username: ${JOBS_DB_USER:jobs}
    password: ${JOBS_DB_PASSWORD:dev-only-jobs}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys come from jwk-set-uri (reachable from inside the container);
          # the iss claim is validated against issuer-uri (public URL). No discovery call.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/fachowcy/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/fachowcy}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys come from jwk-set-uri (reachable from inside the container);
          # the iss claim is validated against issuer-uri (public URL). No discovery call.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/fachowcy/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/fachowcy}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: jobs-service
              uri: ${JOBS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/jobs/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:20}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:40}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
